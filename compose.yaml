services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bioscholar
      POSTGRES_USER: bioscholar
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioscholar -d bioscholar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: